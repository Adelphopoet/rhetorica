[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rhetorica-backend"
version = "0.1.0"
description = "Shared backend core for the Rhetorica governed analytics platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "celery>=5.4,<6.0",
  "cryptography>=44.0,<45.0",
  "httpx>=0.28,<1.0",
  "httpx2>=2.12,<3.0",
  "langfuse>=4.0,<5.0",
  "mcp>=1.7,<2.0",
  "openinference-instrumentation-openai-agents>=0.1,<1.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.40,<1.41",
  "opentelemetry-instrumentation-celery>=0.61b0,<0.62",
  "opentelemetry-sdk>=1.28,<2.0",
  "openai-agents==0.22.3",
  "orjson>=3.10,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "redis>=5.2,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "sqlglot>=26,<27",
  "structlog>=24.4,<25.0",
  "tiktoken>=0.9,<1.0",
  "trino>=0.336,<1.0",
  "clickhouse-connect>=0.8,<1.0",
  "impyla>=0.18,<1.0",
  "boto3>=1.36,<2.0",
  "qdrant-client>=1.12,<2.0",
  "fastembed>=0.4,<0.6",
  "reportlab>=4.4,<5.0",
  "plotly>=6.1,<7.0",
  "kaleido>=1.0,<2.0",
  "openpyxl>=3.1,<4.0",
  "xlsxwriter>=3.2,<4.0",
  "temporalio>=1.32.0",
  "jsonschema>=4.26.0",
]

[project.optional-dependencies]
dev = [
  "deptry>=0.23,<1.0",
  "mypy>=1.15,<2.0",
  "pylint>=3.3,<4.0",
  "pre-commit>=4.1,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "pytest-cov>=6.0,<7.0",
  "pytest-xdist>=3.6,<4.0",
  "ruff>=0.11.0,<0.12.0"
]
