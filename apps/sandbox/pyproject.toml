[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rhetorica-sandbox"
version = "0.1.0"
description = "Internal NsJail supervisor for Rhetorica file processing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "rhetorica-backend",
  "uvicorn[standard]>=0.32,<1.0",
  "pandas>=2.2,<3.0",
  "polars>=1.0,<2.0",
  "pyarrow>=18,<20",
  "openpyxl>=3.1,<4.0",
  "xlsxwriter>=3.2,<4.0",
  "python-docx>=1.1,<2.0",
  "python-pptx>=1.0,<2.0",
  "pypdf>=5.0,<6.0",
  "pdfplumber>=0.11,<1.0",
  "pillow>=10.3,<11",
  "matplotlib>=3.10,<4.0",
  "seaborn>=0.13,<1.0",
  "reportlab>=4.4,<5.0",
]

[tool.uv.sources]
rhetorica-backend = { workspace = true }
