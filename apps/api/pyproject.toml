[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rhetorica-api"
version = "0.1.0"
description = "FastAPI runtime for the Rhetorica platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "opentelemetry-instrumentation-fastapi>=0.61b0,<0.62",
  "PyJWT>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "rhetorica-backend",
  "sse-starlette>=2.1,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
  "websockets>=15.0,<17.0",
]

[tool.uv.sources]
rhetorica-backend = { workspace = true }
