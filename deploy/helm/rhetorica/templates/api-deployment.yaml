{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rhetorica.fullname" . }}-api
  labels:
    {{- include "rhetorica.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "rhetorica.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "rhetorica.tolerations" (dict "root" . "component" .Values.api) | nindent 6 }}
      {{- with .Values.api.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: {{ include "rhetorica.fullname" . }}-config
            - secretRef:
                name: {{ include "rhetorica.fullname" . }}-secret
            {{- with .Values.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.database.existingSecret .Values.api.env }}
          env:
            {{- if .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.urlKey | quote }}
            {{- end }}
            {{- with .Values.api.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: api-tmp
              mountPath: /tmp
          {{- if .Values.database.caConfigMap }}
            - name: database-ca
              mountPath: {{ .Values.database.caMountPath | quote }}
              readOnly: true
          {{- end }}
          {{- if .Values.extraCa.existingConfigMap }}
            - name: extra-ca-certs
              mountPath: {{ .Values.extraCa.mountPath | quote }}
              readOnly: true
          {{- end }}
      volumes:
        - name: api-tmp
          emptyDir:
            sizeLimit: {{ .Values.api.tempSizeLimit | quote }}
      {{- if .Values.database.caConfigMap }}
        - name: database-ca
          configMap:
            name: {{ .Values.database.caConfigMap | quote }}
      {{- end }}
      {{- if .Values.extraCa.existingConfigMap }}
        - name: extra-ca-certs
          configMap:
            name: {{ .Values.extraCa.existingConfigMap }}
      {{- end }}
{{- end }}
