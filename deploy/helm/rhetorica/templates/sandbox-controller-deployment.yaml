{{- if and .Values.sandbox.enabled (eq .Values.sandbox.deploymentMode "kubernetes_jobs") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rhetorica.fullname" . }}-sandbox
  labels:
    {{- include "rhetorica.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: sandbox
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "rhetorica.labels" . | nindent 8 }}
        app.kubernetes.io/component: sandbox
    spec:
      serviceAccountName: {{ include "rhetorica.fullname" . }}-sandbox-controller
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "rhetorica.tolerations" (dict "root" . "component" .Values.sandbox.kubernetesJobs.controller) | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox-controller
          image: "{{ .Values.sandbox.image.repository }}:{{ .Values.sandbox.image.tag }}"
          imagePullPolicy: {{ .Values.sandbox.image.pullPolicy }}
          command:
            - /opt/rhetorica-venv/bin/uvicorn
            - rhetorica_sandbox.controller:app
            - --host
            - 0.0.0.0
            - --port
            - "8090"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
          ports:
            - name: http
              containerPort: {{ .Values.sandbox.service.port }}
          env:
            - name: SANDBOX_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rhetorica.fullname" . }}-secret
                  key: SANDBOX_INTERNAL_TOKEN
            - name: SANDBOX_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SANDBOX_K8S_INSTANCE
              value: {{ .Release.Name | quote }}
            - name: SANDBOX_RUNNER_IMAGE
              value: "{{ .Values.sandbox.image.repository }}:{{ .Values.sandbox.image.tag }}"
            - name: SANDBOX_RUNNER_IMAGE_PULL_POLICY
              value: {{ .Values.sandbox.image.pullPolicy | quote }}
            - name: SANDBOX_RUNNER_SECRET_NAME
              value: {{ printf "%s-secret" (include "rhetorica.fullname" .) | quote }}
            - name: SANDBOX_RUNNER_IMAGE_PULL_SECRETS_JSON
              value: {{ toJson .Values.global.imagePullSecrets | quote }}
            - name: SANDBOX_MAX_SESSIONS
              value: {{ .Values.sandbox.kubernetesJobs.maxSessions | quote }}
            - name: SANDBOX_RUNNER_STARTUP_TIMEOUT_SECONDS
              value: {{ .Values.sandbox.kubernetesJobs.startupTimeoutSeconds | quote }}
            - name: SANDBOX_PROCESS_TIMEOUT_SECONDS
              value: {{ .Values.sandbox.processTimeoutSeconds | quote }}
            - name: SANDBOX_SESSION_TTL_MINUTES
              value: {{ .Values.sandbox.sessionTtlMinutes | quote }}
            - name: SANDBOX_CLEANUP_INTERVAL_SECONDS
              value: {{ .Values.sandbox.cleanupIntervalSeconds | quote }}
            - name: SANDBOX_MAX_INPUT_BYTES
              value: {{ .Values.config.fileMaxInputBytes | quote }}
            - name: SANDBOX_MAX_OUTPUT_BYTES
              value: {{ .Values.config.fileMaxOutputBytes | quote }}
            - name: SANDBOX_MAX_SESSION_OUTPUT_BYTES
              value: {{ .Values.config.fileMaxSessionOutputBytes | quote }}
            - name: SANDBOX_MAX_WORKSPACE_BYTES
              value: {{ .Values.sandbox.maxWorkspaceBytes | quote }}
            - name: SANDBOX_MAX_TMP_BYTES
              value: {{ .Values.sandbox.maxTmpBytes | quote }}
            - name: SANDBOX_MAX_LOG_BYTES
              value: {{ .Values.sandbox.maxLogBytes | quote }}
            - name: SANDBOX_RUNNER_PROCESS_MEMORY_LIMIT_BYTES
              value: {{ .Values.sandbox.kubernetesJobs.runner.processMemoryLimitBytes | quote }}
            - name: SANDBOX_RUNNER_CPU_MS_PER_SECOND
              value: {{ .Values.sandbox.kubernetesJobs.runner.cpuMsPerSecond | quote }}
            - name: SANDBOX_RUNNER_WORKSPACE_SIZE_LIMIT
              value: {{ .Values.sandbox.kubernetesJobs.runner.workspaceSizeLimit | quote }}
            - name: SANDBOX_RUNNER_CPU_REQUEST
              value: {{ .Values.sandbox.kubernetesJobs.runner.resources.requests.cpu | quote }}
            - name: SANDBOX_RUNNER_MEMORY_REQUEST
              value: {{ .Values.sandbox.kubernetesJobs.runner.resources.requests.memory | quote }}
            - name: SANDBOX_RUNNER_EPHEMERAL_STORAGE_REQUEST
              value: {{ index .Values.sandbox.kubernetesJobs.runner.resources.requests "ephemeral-storage" | quote }}
            - name: SANDBOX_RUNNER_CPU_LIMIT
              value: {{ .Values.sandbox.kubernetesJobs.runner.resources.limits.cpu | quote }}
            - name: SANDBOX_RUNNER_MEMORY_LIMIT
              value: {{ .Values.sandbox.kubernetesJobs.runner.resources.limits.memory | quote }}
            - name: SANDBOX_RUNNER_EPHEMERAL_STORAGE_LIMIT
              value: {{ index .Values.sandbox.kubernetesJobs.runner.resources.limits "ephemeral-storage" | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.sandbox.kubernetesJobs.controller.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
{{- end }}
