{{- if .Values.executionRuntime.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rhetorica.fullname" . }}-execution-runtime
  labels:
    {{- include "rhetorica.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: execution-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.executionRuntime.service.port }}
      targetPort: http
{{- end }}
