{{- if and .Values.web.enabled .Values.web.redirectIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rhetorica.fullname" . }}-web-redirect
  labels:
    {{- include "rhetorica.labels" . | nindent 4 }}
  {{- with .Values.web.redirectIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.web.redirectIngress.className }}
  ingressClassName: {{ .Values.web.redirectIngress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.web.redirectIngress.host | quote }}
      http:
        paths:
          - path: {{ .Values.web.redirectIngress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "rhetorica.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
  tls:
    {{- toYaml .Values.web.redirectIngress.tls | nindent 4 }}
{{- end }}
