{{- $secretName := printf "%s-secret" (include "rhetorica.fullname" .) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $developmentJwtSecret := "change-me-rhetorica-dev-jwt-secret-0000000000000000" -}}
{{- $authJwtSecret := .Values.secrets.authJwtSecret -}}
{{- if eq $authJwtSecret $developmentJwtSecret -}}
{{- $authJwtSecret = "" -}}
{{- end -}}
{{- if and (not $authJwtSecret) $existingSecret (hasKey $existingSecret.data "AUTH_JWT_SECRET") -}}
{{- $existingAuthJwtSecret := index $existingSecret.data "AUTH_JWT_SECRET" | b64dec -}}
{{- if ne $existingAuthJwtSecret $developmentJwtSecret -}}
{{- $authJwtSecret = $existingAuthJwtSecret -}}
{{- end -}}
{{- end -}}
{{- if not $authJwtSecret -}}
{{- $authJwtSecret = randAlphaNum 64 -}}
{{- end -}}
{{- $authApiTokenPepper := .Values.secrets.authApiTokenPepper -}}
{{- if and (not $authApiTokenPepper) $existingSecret (hasKey $existingSecret.data "AUTH_API_TOKEN_PEPPER") -}}
{{- $authApiTokenPepper = index $existingSecret.data "AUTH_API_TOKEN_PEPPER" | b64dec -}}
{{- end -}}
{{- if not $authApiTokenPepper -}}
{{- $authApiTokenPepper = randAlphaNum 64 -}}
{{- end -}}
{{- $authOauthTokenPepper := .Values.secrets.authOauthTokenPepper -}}
{{- if and (not $authOauthTokenPepper) $existingSecret (hasKey $existingSecret.data "AUTH_OAUTH_TOKEN_PEPPER") -}}
{{- $authOauthTokenPepper = index $existingSecret.data "AUTH_OAUTH_TOKEN_PEPPER" | b64dec -}}
{{- end -}}
{{- if not $authOauthTokenPepper -}}
{{- $authOauthTokenPepper = randAlphaNum 64 -}}
{{- end -}}
{{- $developmentBootstrapSecrets := list "change-me-rhetorica-bootstrap-secret-0000000000" "change-me-rhetorica-dev-bootstrap-secret-000000000000" -}}
{{- $authBootstrapLoginSecret := .Values.secrets.authBootstrapLoginSecret -}}
{{- if has $authBootstrapLoginSecret $developmentBootstrapSecrets -}}
{{- $authBootstrapLoginSecret = "" -}}
{{- end -}}
{{- if and (not $authBootstrapLoginSecret) $existingSecret (hasKey $existingSecret.data "AUTH_BOOTSTRAP_LOGIN_SECRET") -}}
{{- $existingAuthBootstrapLoginSecret := index $existingSecret.data "AUTH_BOOTSTRAP_LOGIN_SECRET" | b64dec -}}
{{- if not (has $existingAuthBootstrapLoginSecret $developmentBootstrapSecrets) -}}
{{- $authBootstrapLoginSecret = $existingAuthBootstrapLoginSecret -}}
{{- end -}}
{{- end -}}
{{- if not $authBootstrapLoginSecret -}}
{{- $authBootstrapLoginSecret = randAlphaNum 64 -}}
{{- end -}}
{{- $existingKeycloakClientSecret := "" -}}
{{- if and $existingSecret (hasKey $existingSecret.data "RHETORICA_KEYCLOAK_CLIENT_SECRET") -}}
{{- $existingKeycloakClientSecret = index $existingSecret.data "RHETORICA_KEYCLOAK_CLIENT_SECRET" | b64dec -}}
{{- end -}}
{{- $keycloakClientSecret := default $existingKeycloakClientSecret .Values.secrets.keycloakClientSecret -}}
{{- $executionRuntimeInternalToken := .Values.secrets.executionRuntimeInternalToken -}}
{{- if and (not $executionRuntimeInternalToken) $existingSecret (hasKey $existingSecret.data "EXECUTION_RUNTIME_INTERNAL_TOKEN") -}}
{{- $executionRuntimeInternalToken = index $existingSecret.data "EXECUTION_RUNTIME_INTERNAL_TOKEN" | b64dec -}}
{{- end -}}
{{- if not $executionRuntimeInternalToken -}}
{{- $executionRuntimeInternalToken = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "rhetorica.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_JWT_SECRET: {{ $authJwtSecret | quote }}
  AUTH_API_TOKEN_PEPPER: {{ $authApiTokenPepper | quote }}
  AUTH_OAUTH_TOKEN_PEPPER: {{ $authOauthTokenPepper | quote }}
  AUTH_LOCAL_ADMIN_LOGIN: {{ .Values.secrets.authLocalAdminLogin | quote }}
  {{- if .Values.secrets.authLocalAdminPassword }}
  AUTH_LOCAL_ADMIN_PASSWORD: {{ .Values.secrets.authLocalAdminPassword | quote }}
  {{- end }}
  AUTH_BOOTSTRAP_LOGIN_SECRET: {{ $authBootstrapLoginSecret | quote }}
  {{- if $keycloakClientSecret }}
  RHETORICA_KEYCLOAK_CLIENT_SECRET: {{ $keycloakClientSecret | quote }}
  {{- end }}
  RAG_QDRANT_API_KEY: {{ .Values.secrets.ragQdrantApiKey | quote }}
  DOCUMENTATION_API_TOKEN: {{ .Values.secrets.documentationApiToken | quote }}
  DOCUMENTATION_EMBEDDING_API_KEY: {{ .Values.secrets.documentationEmbeddingApiKey | quote }}
  DOCUMENTATION_QDRANT_API_KEY: {{ .Values.secrets.documentationQdrantApiKey | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  {{- if .Values.codingRunner.enabled }}
  CODING_CONTROLLER_INTERNAL_TOKEN: {{ required "secrets.codingControllerInternalToken is required when codingRunner is enabled" .Values.secrets.codingControllerInternalToken | quote }}
  CODING_CONTROLLER_CONTROLLER_SECRET: {{ required "secrets.codingControllerSecret is required when codingRunner is enabled" .Values.secrets.codingControllerSecret | quote }}
  CODING_QUERY_GATEWAY_INTERNAL_TOKEN: {{ required "secrets.codingQueryGatewayInternalToken is required when codingRunner is enabled" .Values.secrets.codingQueryGatewayInternalToken | quote }}
  CODING_ARTIFACT_SIGNING_SECRET: {{ required "secrets.codingArtifactSigningSecret is required when codingRunner is enabled" .Values.secrets.codingArtifactSigningSecret | quote }}
  CODING_QUERY_GATEWAY_SIGNING_SECRET: {{ required "secrets.codingQueryGatewaySigningSecret is required when codingRunner is enabled" .Values.secrets.codingQueryGatewaySigningSecret | quote }}
  {{- end }}
  EXECUTION_RUNTIME_INTERNAL_TOKEN: {{ $executionRuntimeInternalToken | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
