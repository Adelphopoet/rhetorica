{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rhetorica.fullname" . }}-web
  labels:
    {{- include "rhetorica.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "rhetorica.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "rhetorica.tolerations" (dict "root" . "component" .Values.web) | nindent 6 }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "rhetorica.fullname" . }}-config
            - secretRef:
                name: {{ include "rhetorica.fullname" . }}-secret
          {{- if or .Values.web.env (and .Values.extraCa.existingConfigMap .Values.extraCa.nodeExtraCaCertsFile) }}
          env:
            {{- with .Values.web.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if and .Values.extraCa.existingConfigMap .Values.extraCa.nodeExtraCaCertsFile }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ printf "%s/%s" .Values.extraCa.mountPath .Values.extraCa.nodeExtraCaCertsFile | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.extraCa.existingConfigMap }}
          volumeMounts:
            - name: extra-ca-certs
              mountPath: {{ .Values.extraCa.mountPath | quote }}
              readOnly: true
          {{- end }}
      {{- if .Values.extraCa.existingConfigMap }}
      volumes:
        - name: extra-ca-certs
          configMap:
            name: {{ .Values.extraCa.existingConfigMap }}
      {{- end }}
{{- end }}
