{{- if or .Values.executionRuntime.enabled .Values.codingRunner.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rhetorica.fullname" . }}-execution-controller
  labels:
    {{- include "rhetorica.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rhetorica.fullname" . }}-execution-controller
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rhetorica.fullname" . }}-execution-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "rhetorica.fullname" . }}-execution-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rhetorica.fullname" . }}-execution-controller
{{- end }}
