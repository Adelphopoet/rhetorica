{{- if .Values.codingRunner.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhetorica.fullname" . }}-coding-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rhetorica-coding-runner
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhetorica.fullname" . }}-coding-controller-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rhetorica-coding-runner
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: execution-controller
      ports:
        - protocol: TCP
          port: 8091
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhetorica.fullname" . }}-coding-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: coding-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rhetorica-coding-runner
              rhetorica.io/network-profile: coding-runtime
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: execution-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: {{ .Values.codingRunner.gateway.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhetorica.fullname" . }}-coding-brokers-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rhetorica-coding-runner
      app.kubernetes.io/instance: {{ .Release.Name }}
      rhetorica.io/network-profile: coding-runtime
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.codingRunner.networkPolicy.gatewayPodSelector | nindent 14 }}
      ports:
        {{- range .Values.codingRunner.networkPolicy.gatewayPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.codingRunner.networkPolicy.artifactRelayPodSelector | nindent 14 }}
      ports:
        {{- range .Values.codingRunner.networkPolicy.artifactRelayPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.executionRuntime.networkPolicy.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.executionRuntime.networkPolicy.dnsPodSelector | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rhetorica.fullname" . }}-coding-dependencies-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rhetorica-coding-runner
      app.kubernetes.io/instance: {{ .Release.Name }}
      rhetorica.io/network-profile: coding-dependencies
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.codingRunner.networkPolicy.packageMirrorPodSelector | nindent 14 }}
      ports:
        {{- range .Values.codingRunner.networkPolicy.packageMirrorPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.executionRuntime.networkPolicy.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.executionRuntime.networkPolicy.dnsPodSelector | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- end }}
