global:
  imagePullSecrets: []
  tolerations: []

extraCa:
  existingConfigMap: ""
  mountPath: /workspace/.rhetorica/certs
  nodeExtraCaCertsFile: ""

namespaceControls:
  roleBinding:
    enabled: false
    name: sa-admin-binding
    subjectKind: User
    subjectName: ""
    roleKind: ClusterRole
    roleName: admin
  resourceQuota:
    enabled: false
    hard: {}
  limitRange:
    enabled: false
    limits: []

infra:
  enabled: false
  tolerations: null
  imagePullPolicy: IfNotPresent
  storageClassName: ""
  temporal:
    # Optional single-node Temporal beside embedded dev infrastructure.
    # Production can continue using an independently operated Temporal frontend.
    enabled: false
    image: temporalio/auto-setup:1.29.3
    existingSecret: ""
    passwordKey: password
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  postgres:
    image: postgres:16-alpine
    database: rhetorica
    username: rhetorica
    password: rhetorica
    servicePort: 5432
    externalAccess:
      enabled: false
      type: LoadBalancer
      port: 5432
      annotations: {}
      externalTrafficPolicy: Cluster
      loadBalancerIP: ""
      loadBalancerSourceRanges: []
    storageSize: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  redis:
    image: redis:7-alpine
    servicePort: 6379
    storageSize: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  qdrant:
    image: qdrant/qdrant:v1.13.2
    servicePort: 6333
    storageSize: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z
    initImage: quay.io/minio/mc:RELEASE.2025-03-12T17-29-24Z
    rootUser: minio
    rootPassword: minio123
    bucket: rhetorica-dev
    servicePort: 9000
    consolePort: 9001
    storageSize: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

api:
  enabled: true
  tolerations: null
  replicaCount: 1
  lifecycle: {}
  hostAliases: []
  image:
    repository: ghcr.io/adelphopoet/rhetorica/api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  env: []
  extraEnvFrom: []
  # Disk-backed ephemeral workspace for streaming snapshots/XLSX ZIP assembly.
  tempSizeLimit: 2Gi
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 3Gi

scenarioWorkflows:
  enabled: false
  temporal:
    # External frontend; leave empty when infra.temporal.enabled supplies it.
    address: ""
    namespace: default
    taskQueue: rhetorica-scenarios-v1
    tlsSecret: ""
    serverName: ""
  worker:
    # Keep enabled when disabling admission, to drain already accepted runs.
    enabled: false
    replicaCount: 1
    concurrency: 2
    # Scenario workers receive connector credentials, but never Langfuse credentials.
    extraEnvFrom: []
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
        ephemeral-storage: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 3Gi

worker:
  enabled: true
  tolerations: null
  replicaCount: 1
  lifecycle: {}
  hostAliases: []
  image:
    repository: ghcr.io/adelphopoet/rhetorica/worker
    tag: latest
    pullPolicy: IfNotPresent
  env: []
  extraEnvFrom: []
  tempSizeLimit: 2Gi
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 3Gi

# Shared file/Python runtime. Coding Jobs use the same image and process executor.
# Production enables a gVisor RuntimeClass; local Compose is an integration boundary.
executionRuntime:
  enabled: false
  image:
    repository: ghcr.io/adelphopoet/rhetorica/coding-runner
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8091
  runtimeClassName: runsc
  nodeSelector:
    rhetorica.io/coding-runtime: gvisor
  tolerations:
    - key: rhetorica.io/coding-runtime
      operator: Equal
      value: gvisor
      effect: NoSchedule
  maxActiveJobs: 10
  startupTimeoutSeconds: 60
  reconcileIntervalSeconds: 30
  processTimeoutSeconds: 60
  sessionTtlMinutes: 20
  cleanupIntervalSeconds: 60
  maxWorkspaceBytes: "536870912"
  maxLogBytes: "65536"
  maxOutputFiles: "100"
  maxSessionOutputFiles: "200"
  memoryLimitBytes: "1073741824"
  pidLimit: "64"
  workspaceSizeLimit: 1Gi
  controller:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 300m, memory: 384Mi}
  networkPolicy:
    objectStoragePodSelector:
      app.kubernetes.io/component: infra
    objectStoragePorts: [9000]
    dnsNamespaceSelector:
      kubernetes.io/metadata.name: kube-system
    dnsPodSelector:
      k8s-app: kube-dns
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 512Mi
    limits:
      cpu: "2"
      memory: 2304Mi
      ephemeral-storage: 2Gi

# Governed coding control plane. Task Jobs use the same runner image and
# process executor as file/Python, always under gVisor in Kubernetes.
codingRunner:
  enabled: false
  gateway:
    # Query handles are process-local; horizontal scaling requires a shared registry.
    replicaCount: 1
    publicBaseUrl: ""
    # The gateway resolves DWH connector secrets itself. Configure the selected
    # SecretStore backend and only the credentials required by coding here.
    # Do not inherit API/worker LLM, GitLab, or MCP secret sources.
    env: []
    extraEnvFrom: []
    service:
      port: 8082
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 300m, memory: 384Mi}
  runner:
    imageDigest: ""
    softwareManifestDigest: ""
    # JSON tool manifest whose sha256 equals softwareManifestDigest; mounted into the API
    # so environment profiles record deployment-owned tool versions.
    softwareManifest: ""
    runtimeClassName: runsc
    nodeSelector:
      rhetorica.io/coding-runtime: gvisor
    tolerations:
      - key: rhetorica.io/coding-runtime
        operator: Equal
        value: gvisor
        effect: NoSchedule
  worker:
    # Requires a Temporal frontend (same as scenarioWorkflows.worker).
    enabled: false
    replicaCount: 1
    extraEnvFrom: []
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 768Mi}
  service:
    port: 8091
  networkPolicy:
    gatewayPodSelector:
      app.kubernetes.io/component: coding-gateway
    artifactRelayPodSelector:
      app.kubernetes.io/component: execution-controller
    packageMirrorPodSelector:
      app.kubernetes.io/component: package-mirror
    gatewayPorts: [8082]
    artifactRelayPorts: [8091]
    packageMirrorPorts: [8080]

web:
  enabled: true
  tolerations: null
  replicaCount: 1
  image:
    repository: ghcr.io/adelphopoet/rhetorica/web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  redirectIngress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /
    tls: []
  env: []
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

config:
  # Optimized direct tools + deferred loading; these settings are shared by all workers.
  # Explicit false is a rollback override, including upgrades with --reuse-values.
  chatContextHarnessEnabled: true
  chatToolOutputPolicyEnabled: true
  chatToolDispatchEnabled: false
  chatCertifiedToolConcurrencyEnabled: true
  chatMaxIterations: 100
  chatContextCompactionEnabled: true
  chatContextTrimTriggerRatio: 0.7
  chatContextCompactionTriggerRatio: 0.8
  chatContextTargetRatio: 0.5
  chatContextCompactionMaxCalls: 10
  # Raw artifact retention, independent of the bounded model-facing envelope.
  chatToolArtifactMaxChars: 16000000
  chatToolArtifactTtlHours: 168
  chatToolArtifactMaxRecordsPerConversation: 100
  appEnv: prod
  logLevel: INFO
  logJson: true
  logLlmContent: false
  otelEnabled: false
  otelExporterOtlpEndpoint: ""
  otelExporterOtlpInsecure: "false"
  otelExporterOtlpTimeout: "5"
  otelBatchSpanExportTimeout: "5000"
  otelTracesSampler: parentbased_traceidratio
  otelTracesSamplerArg: "0.1"
  otelMetricExportInterval: "30000"
  otelMetricExportTimeout: "5000"
  langfuseEnabled: false
  langfuseCaptureContent: false
  langfuseAnnotationQueueId: ""
  langfuseFeedbackScoreName: rhetorica_human_feedback
  langfuseReviewPriorityScoreName: rhetorica_review_priority
  databaseUrl: ""
  redisUrl: ""
  rateLimitRedisKeyPrefix: rhetorica:rate-limit:api
  celeryBrokerUrl: ""
  celeryResultBackend: ""
  qdrantUrl: ""
  ragCollectionName: rag_insights
  ragVectorSize: "384"
  ragDistance: cosine
  ragPreferGrpc: "false"
  ragEmbeddingModel: BAAI/bge-small-en-v1.5
  ragConfidenceThreshold: "0.7"
  ragMergeSimilarityThreshold: "0.9"
  documentationBaseUrl: ""
  documentationConnectorName: platform_docs
  documentationWorkspaceId: default
  documentationIndexUrl: ""
  documentationContentFormat: markdown
  documentationAuthType: none
  documentationVerifyTls: "true"
  documentationIncludePaths: ""
  documentationExcludePaths: ""
  documentationSyncEnabled: "true"
  documentationSyncIntervalMinutes: "1440"
  documentationQdrantCollection: documentation_chunks
  documentationQdrantPreferGrpc: "false"
  documentationVectorSize: "1024"
  documentationEmbeddingBaseUrl: ""
  documentationEmbeddingModel: BAAI/bge-small-en-v1.5
  documentationEmbeddingEndpointPath: /v1/embeddings
  documentationEmbeddingTimeoutSeconds: "120"
  s3Endpoint: ""
  s3Bucket: ""
  s3Region: us-east-1
  s3Secure: "false"
  executionRuntimeUrl: ""
  fileMaxInputBytes: "26214400"
  fileMaxFilesPerTurn: "5"
  fileMaxTurnBytes: "52428800"
  fileMaxOutputBytes: "52428800"
  fileMaxSessionOutputBytes: "104857600"
  fileSqlExportMaxRows: "1048575"
  fileSqlExportMaxBytes: "536870912"
  sqlResultSnapshotMaxBytes: "536870912"
  sqlResultSnapshotMaxCellBytes: "1048576"
  sqlResultSnapshotMaxRowBytes: "16777216"
  sqlResultPreviewRows: "500"
  fileUserQuotaBytes: "1073741824"
  fileWorkspaceQuotaBytes: "10737418240"
  fileStagedTtlHours: "24"
  llmBaseUrl: ""
  authEnabled: true
  authDefaultWorkspaceId: default
  authCookieSecure: true
  authCookieSameSite: lax
  authLocalAdminDisplayName: Platform Admin
  authBootstrapEnabled: false
  authKeycloakEnabled: false
  authKeycloakIssuerUrl: ""
  authKeycloakClientId: ""
  authKeycloakAdminGroups: ""
  authKeycloakAnalystGroups: ""
  authKeycloakRequireMappedGroup: true
  authOauthCimdEnabled: true
  authOauthTransactionTtlMinutes: "10"
  authOauthCodeTtlMinutes: "5"
  authOauthAccessTtlMinutes: "60"
  authOauthRefreshTtlDays: "30"
  authOauthDcrRegistrationsPerSource: "30"
  authOauthDcrMaxClients: "10000"
  authOauthRecordRetentionHours: "24"
  authOauthDcrInactiveClientRetentionDays: "90"
  mcpAllowedHosts: "127.0.0.1:*,localhost:*,[::1]:*"
  mcpAllowedOrigins: "http://127.0.0.1:*,http://localhost:*"
  webPublicUrl: ""
  publicApiUrl: ""
  webKeycloakRedirectUri: ""
  webKeycloakPostLogoutRedirectUri: ""
  webApiUrl: ""

