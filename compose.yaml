name: rhetorica

services:
  temporal-postgres-init:
    image: postgres:16-alpine
    profiles: ["apps"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TEMPORAL_POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
    entrypoint: ["/bin/sh", "/init-temporal.sh"]
    volumes:
      - ./deploy/temporal/init-postgres.sh:/init-temporal.sh:ro

  temporal:
    image: temporalio/auto-setup:1.29.3
    entrypoint: ["/bin/sh", "-ec", "sh /etc/temporal/schema-init.sh && exec /etc/temporal/entrypoint.sh autosetup"]
    volumes:
      - ./deploy/helm/rhetorica/files/temporal-schema-init.sh:/etc/temporal/schema-init.sh:ro
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      temporal-postgres-init:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal_persistence
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      DBNAME: ${POSTGRES_DB}
      VISIBILITY_DBNAME: ${POSTGRES_DB}
      VISIBILITY_POSTGRES_USER: temporal_visibility
      SKIP_DB_CREATE: "true"
      SKIP_SCHEMA_SETUP: "true"
      SQL_MAX_CONNS: 4
      SQL_MAX_IDLE_CONNS: 2
      SQL_VIS_MAX_CONNS: 2
      SQL_VIS_MAX_IDLE_CONNS: 1
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30

  scenario-worker:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    working_dir: /workspace
    environment:
      RHETORICA_WORKER_KIND: scenarios
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: rhetorica-scenarios-v1
      PYTHONPATH: /workspace/apps/worker/src:/workspace/packages/backend/src
      UV_PROJECT_ENVIRONMENT: /tmp/.venv-scenario-worker
    volumes:
      - .:/workspace
      - uv-cache:/root/.cache/uv
      - scenario-worker-tmp:/tmp

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done &&
      mc mb --ignore-existing local/${MINIO_BUCKET}
      "

  api:
    profiles: ["apps"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      sandbox:
        condition: service_healthy
    env_file:
      - .env
    working_dir: /workspace
    environment:
      API_APP_ENV: dev
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_DEFAULT_WORKSPACE_ID: ${AUTH_DEFAULT_WORKSPACE_ID:-default}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-rhetorica-dev-jwt-secret-0000000000000000}
      AUTH_API_TOKEN_PEPPER: ${AUTH_API_TOKEN_PEPPER:-change-me-rhetorica-dev-pat-pepper-0000000000000000}
      AUTH_OAUTH_TOKEN_PEPPER: ${AUTH_OAUTH_TOKEN_PEPPER:-change-me-rhetorica-dev-oauth-pepper-0000000000000000}
      AUTH_OAUTH_CIMD_ENABLED: ${AUTH_OAUTH_CIMD_ENABLED:-true}
      AUTH_OAUTH_TRANSACTION_TTL_MINUTES: ${AUTH_OAUTH_TRANSACTION_TTL_MINUTES:-10}
      AUTH_OAUTH_CODE_TTL_MINUTES: ${AUTH_OAUTH_CODE_TTL_MINUTES:-5}
      AUTH_OAUTH_ACCESS_TTL_MINUTES: ${AUTH_OAUTH_ACCESS_TTL_MINUTES:-60}
      AUTH_OAUTH_REFRESH_TTL_DAYS: ${AUTH_OAUTH_REFRESH_TTL_DAYS:-30}
      AUTH_OAUTH_DCR_REGISTRATIONS_PER_SOURCE: ${AUTH_OAUTH_DCR_REGISTRATIONS_PER_SOURCE:-30}
      AUTH_OAUTH_DCR_MAX_CLIENTS: ${AUTH_OAUTH_DCR_MAX_CLIENTS:-10000}
      AUTH_OAUTH_RECORD_RETENTION_HOURS: ${AUTH_OAUTH_RECORD_RETENTION_HOURS:-24}
      AUTH_OAUTH_DCR_INACTIVE_CLIENT_RETENTION_DAYS: ${AUTH_OAUTH_DCR_INACTIVE_CLIENT_RETENTION_DAYS:-90}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_REDIS_KEY_PREFIX: ${RATE_LIMIT_REDIS_KEY_PREFIX:-rhetorica:rate-limit:api}
      RHETORICA_PUBLIC_URL: ${RHETORICA_PUBLIC_URL:-http://localhost:3000}
      RHETORICA_PUBLIC_API_URL: ${RHETORICA_PUBLIC_API_URL:-http://localhost:8000}
      AUTH_LOCAL_ADMIN_LOGIN: ${AUTH_LOCAL_ADMIN_LOGIN:-}
      AUTH_LOCAL_ADMIN_PASSWORD: ${AUTH_LOCAL_ADMIN_PASSWORD:-}
      AUTH_LOCAL_ADMIN_DISPLAY_NAME: ${AUTH_LOCAL_ADMIN_DISPLAY_NAME:-Platform Admin}
      AUTH_BOOTSTRAP_ENABLED: ${AUTH_BOOTSTRAP_ENABLED:-false}
      AUTH_BOOTSTRAP_LOGIN_SECRET: ${AUTH_BOOTSTRAP_LOGIN_SECRET:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,[::1]:*,api:8000}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_LEVEL: DEBUG
      LOG_LLM_CONTENT: "true"
      MATTERMOST_LISTENER_ENABLED: ${MATTERMOST_LISTENER_ENABLED:-false}
      SANDBOX_URL: http://sandbox:8090
      SANDBOX_INTERNAL_TOKEN: ${SANDBOX_INTERNAL_TOKEN:-change-me-sandbox-internal-token}
      FILE_SQL_EXPORT_MAX_ROWS: ${FILE_SQL_EXPORT_MAX_ROWS:-1048575}
      FILE_SQL_EXPORT_MAX_BYTES: ${FILE_SQL_EXPORT_MAX_BYTES:-536870912}
      SQL_RESULT_SNAPSHOT_MAX_BYTES: ${SQL_RESULT_SNAPSHOT_MAX_BYTES:-536870912}
      SQL_RESULT_SNAPSHOT_MAX_CELL_BYTES: ${SQL_RESULT_SNAPSHOT_MAX_CELL_BYTES:-1048576}
      SQL_RESULT_SNAPSHOT_MAX_ROW_BYTES: ${SQL_RESULT_SNAPSHOT_MAX_ROW_BYTES:-16777216}
      SQL_RESULT_PREVIEW_ROWS: ${SQL_RESULT_PREVIEW_ROWS:-500}
      PYTHONPATH: /workspace/apps/api/src:/workspace/packages/backend/src
      UV_PROJECT_ENVIRONMENT: /tmp/.venv-api
    volumes:
      - .:/workspace
      - uv-cache:/root/.cache/uv
      - api-tmp:/tmp
    ports:
      - "${API_PORT}:8000"

  sandbox:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/sandbox/Dockerfile
    restart: unless-stopped
    privileged: true
    cgroup: host
    read_only: true
    environment:
      SANDBOX_INTERNAL_TOKEN: ${SANDBOX_INTERNAL_TOKEN:-change-me-sandbox-internal-token}
      SANDBOX_SESSIONS_ROOT: /var/lib/rhetorica-sandbox/sessions
      SANDBOX_PYTHON_PATH: /opt/rhetorica-venv/bin/python
      SANDBOX_MAX_PARALLEL_RUNS: ${SANDBOX_MAX_PARALLEL_RUNS:-2}
      SANDBOX_PROCESS_TIMEOUT_SECONDS: ${SANDBOX_PROCESS_TIMEOUT_SECONDS:-60}
      SANDBOX_SESSION_TTL_MINUTES: ${SANDBOX_SESSION_TTL_MINUTES:-20}
      SANDBOX_CLEANUP_INTERVAL_SECONDS: ${SANDBOX_CLEANUP_INTERVAL_SECONDS:-60}
      SANDBOX_MAX_INPUT_BYTES: ${SANDBOX_MAX_INPUT_BYTES:-26214400}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-52428800}
      SANDBOX_MAX_SESSION_OUTPUT_BYTES: ${SANDBOX_MAX_SESSION_OUTPUT_BYTES:-104857600}
      SANDBOX_MAX_WORKSPACE_BYTES: ${SANDBOX_MAX_WORKSPACE_BYTES:-536870912}
      SANDBOX_MAX_TMP_BYTES: ${SANDBOX_MAX_TMP_BYTES:-134217728}
      SANDBOX_MAX_LOG_BYTES: ${SANDBOX_MAX_LOG_BYTES:-65536}
      SANDBOX_MAX_OUTPUT_FILES: ${SANDBOX_MAX_OUTPUT_FILES:-100}
      SANDBOX_MAX_SESSION_OUTPUT_FILES: ${SANDBOX_MAX_SESSION_OUTPUT_FILES:-200}
      SANDBOX_MEMORY_LIMIT_BYTES: ${SANDBOX_MEMORY_LIMIT_BYTES:-1073741824}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-64}
      SANDBOX_CPU_MS_PER_SECOND: ${SANDBOX_CPU_MS_PER_SECOND:-1000}
      SANDBOX_MANAGE_LEGACY_CGROUP_PARENTS: ${SANDBOX_MANAGE_LEGACY_CGROUP_PARENTS:-true}
    tmpfs:
      - /var/lib/rhetorica-sandbox:size=1073741824,mode=0711
      - /tmp:size=134217728,mode=1777
    mem_limit: 2304m
    cpus: 2.25
    pids_limit: 192
    healthcheck:
      test: ["CMD", "/opt/rhetorica-venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - .env
    working_dir: /workspace
    environment:
      WORKER_APP_ENV: dev
      LOG_LEVEL: DEBUG
      LOG_LLM_CONTENT: "true"
      PYTHONPATH: /workspace/apps/worker/src:/workspace/packages/backend/src
      UV_PROJECT_ENVIRONMENT: /tmp/.venv-worker
    volumes:
      - .:/workspace
      - uv-cache:/root/.cache/uv
      - worker-tmp:/tmp

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    depends_on:
      api:
        condition: service_started
    env_file:
      - .env
    working_dir: /workspace/apps/web
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      RHETORICA_API_URL: http://api:8000
      RHETORICA_PUBLIC_URL: ${RHETORICA_PUBLIC_URL:-http://localhost:3000}
      RHETORICA_PUBLIC_API_URL: ${RHETORICA_PUBLIC_API_URL:-http://localhost:8000}
      CI: "1"
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
    ports:
      - "${WEB_PORT}:3000"
    command: >-
      sh -lc "pnpm --dir /workspace install --frozen-lockfile --force && pnpm --dir /workspace --filter @rhetorica/web dev"


volumes:
  scenario-worker-tmp:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  uv-cache:
  api-tmp:
  worker-tmp:
  pnpm-store:
